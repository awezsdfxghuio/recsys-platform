services:
  seaweed_master:
    image: dockerhub.timeweb.cloud/chrislusf/seaweedfs:latest
    container_name: seaweed_master
    ports:
      - "9333:9333"
    command: "master -ip=seaweed_master -ip.bind=0.0.0.0"

  seaweed_volume1:
    image: dockerhub.timeweb.cloud/chrislusf/seaweedfs:latest
    container_name: seaweed_volume1
    ports:
      - "8080:8080"
    command: "volume -mserver=seaweed_master:9333 -port=8080 -ip=seaweed_volume1 -ip.bind=0.0.0.0"
    depends_on:
      - seaweed_master

  seaweed_volume2:
    image: dockerhub.timeweb.cloud/chrislusf/seaweedfs:latest
    container_name: seaweed_volume2
    ports:
      - "8081:8080"
    command: "volume -mserver=seaweed_master:9333 -port=8080 -ip=seaweed_volume2 -ip.bind=0.0.0.0"
    depends_on:
      - seaweed_master

  seaweed_filer:
    image: dockerhub.timeweb.cloud/chrislusf/seaweedfs:latest
    container_name: seaweed_filer
    ports:
      - "8888:8888"
      - "8333:8333"
    command: "filer -master=seaweed_master:9333 -ip=seaweed_filer -ip.bind=0.0.0.0 -s3"
    depends_on:
      - seaweed_master
      - seaweed_volume1
      - seaweed_volume2